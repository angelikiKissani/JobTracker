[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtracker"
version = "0.3.0"
description = "Keeps a job-application tracker in Google Sheets up to date by reading your inbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["gspread>=6.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
